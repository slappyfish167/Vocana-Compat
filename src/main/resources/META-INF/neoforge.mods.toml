modLoader="javafml"
loaderVersion="[4,)"
license="All Rights Reserved"
issueTrackerURL="https://github.com/slappyfish167/Vocana-Compat/issues"
[[mods]]
modId="vocanacompat"
version="${version}"
displayName="Vocana Compat"
authors="slappyfish167"
displayURL="https://github.com/slappyfish167/Vocana-Compat"
description='''Bridges between Vocana and other mods: Create, Wyrmroost, Ice and Fire: Community Edition, EMI, Curios, Hex Casting and Ars Nouveau. Each bridge is a module that only loads when its mod is installed; every module can be turned off in config/vocanacompat-modules.toml.'''
[[mixins]]
config="vocanacompat.mixins.json"
[[dependencies.vocanacompat]]
modId="vocana"
type="required"
versionRange="[${vocana_version},)"
ordering="AFTER"
side="BOTH"
[[dependencies.vocanacompat]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},21.2)"
ordering="NONE"
side="BOTH"
[[dependencies.vocanacompat]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"
# Optional targets: load after each so their registries exist when a module looks for them.
[[dependencies.vocanacompat]]
modId="create"
type="optional"
versionRange="[6.0.0,)"
ordering="AFTER"
side="BOTH"
[[dependencies.vocanacompat]]
modId="wyrmroost"
type="optional"
versionRange="[1.3.0,)"
ordering="AFTER"
side="BOTH"
[[dependencies.vocanacompat]]
modId="iceandfire"
type="optional"
versionRange="[2.0,)"
ordering="AFTER"
side="BOTH"
[[dependencies.vocanacompat]]
modId="emi"
type="optional"
versionRange="[1.1.0,)"
ordering="AFTER"
side="BOTH"
[[dependencies.vocanacompat]]
modId="curios"
type="optional"
versionRange="[9.0.0,)"
ordering="AFTER"
side="BOTH"
[[dependencies.vocanacompat]]
modId="hexcasting"
type="optional"
versionRange="[0.11.0,)"
ordering="AFTER"
side="BOTH"
[[dependencies.vocanacompat]]
modId="ars_nouveau"
type="optional"
versionRange="[5.0.0,)"
ordering="AFTER"
side="BOTH"
