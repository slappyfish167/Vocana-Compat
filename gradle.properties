org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false

## Toolchain (keep in step with Vocana's build.gradle and ARCHITECTURE_NOTES.md)
minecraft_version=1.21.1
neoforge_version=21.1.255
vocana_version=2.1.0

## Target mods. Every version lives here and nowhere else; docs/targets.md records where each was verified.
## A target can be left out of a local build with -Pcompat.skip=create,emi (comma-separated module names).

# Create 6 for 1.21.1 (Creators-of-Create/Create, branch mc1.21.1/dev). maven.createmod.net publishes
# com.simibubi.create:create-1.21.1:<version>. 6.0.10 is the newest version in the branch's changelog.md;
# gradle.properties on the branch already says 6.0.11 (in development). Bump when 6.0.11 is on the maven.
create_version=6.0.10
flywheel_version=1.0.6
ponder_version=1.0.85
registrate_version=MC1.21-1.3.0+67

# Wyrmroost (NordAct/Wyrmroost, main; no maven). CurseMaven: project 340333, file 8555464 = wyrmroost-1.4.0.jar
# (NeoForge 1.21.1). The source tree is already 1.4.1; replace the file id when that file is on CurseForge.
wyrmroost_curse_project=340333
wyrmroost_curse_file=8555464

# Ice and Fire: Community Edition (IAFEnvoy/IceAndFire-CE, branch 1.21.1, mod 2.1.4; no maven). CurseMaven project
# 1040076. 8457180 is the verified "iceandfire-2.0.jar" file; 2.1.4's file id could not be read from this
# container: open https://www.curseforge.com/minecraft/mc-mods/iceandfire-ce/files/all, pick iceandfire-2.1.4.jar
# and copy its Curse Maven snippet here. Its libraries (from the branch's build.gradle):
iceandfire_curse_project=1040076
iceandfire_curse_file=8457180
iceandfire_uranus_curse=uranus-1010827:8682870
iceandfire_jupiter_curse=jupiter-1072905:7738312
iceandfire_integration_version=0.2

# EMI (emilyploszaj/emi, branch 1.21; dev.emi:emi-neoforge:<mod>+<mc>, tag 1.1.24+1.21.1)
emi_version=1.1.24+1.21.1

# Curios API (TheIllusiveC4/Curios, branch 1.21.1; top.theillusivec4.curios:curios-neoforge:<version>)
curios_version=9.5.1+1.21.1

# Hex Casting on NeoForge 1.21.1: "HexCast NEOFORGED" (a1exrom/hex_cast_NEOFORGED, Modrinth lZGsiJ1L, slug
# hexcast-neoforged, mod id hexcasting, mod version 0.11.1-17+neoforge.1.21.1). Modrinth's maven takes either the
# version number or the version id; confirm the string on https://modrinth.com/mod/hexcast-neoforged/versions.
hexcast_version=0.11.1-17+neoforge.1.21.1
kotlinforforge_version=5.9.0
kotlin_version=2.0.21
# PAUCAL is a runtime-only dependency of HexCast NEOFORGED (the module never compiles against it); the Modrinth version string of its NeoForge 1.21.1 build.
paucal_version=0.7.0+neoforge-1.21.1
patchouli_version=1.21.1-93-NEOFORGE
caelus_version=7.0.1+1.21.1
# The official port (FallingColors/HexMod, branch 1.21, 0.12.0-devel) publishes
# at.petra-k.hexcasting:hexcasting-neoforge-1.21.1:<version> on maven.blamejared.com; see docs/targets.md.

# Ars Nouveau (baileyholl/Ars-Nouveau, main; com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:<version> on
# maven.blamejared.com). CI builds append a build number (IAF CE pins 5.10.3.1204); if 5.13.3 alone does not
# resolve, take the 5.13.3.<build> listed at
# https://maven.blamejared.com/com/hollingsworth/ars_nouveau/ars_nouveau-1.21.1/
ars_nouveau_version=5.13.3
geckolib_version=4.6.6
nuggets_version=1.1.0.48
