name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout vocana-compat
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read the Vocana ref
        id: vocana
        run: echo "ref=$(tr -d '[:space:]' < vocana.ref)" >> "$GITHUB_OUTPUT"

      # Vocana is a compile-time and runtime dependency that has no public maven: it is built from source at the
      # ref in vocana.ref and published to the runner's local maven (dev.vocana:vocana). A private Vocana needs a
      # VOCANA_TOKEN secret (a fine-grained token with read access to that repository).
      - name: Checkout Vocana
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: slappyfish167/Vocana
          ref: ${{ steps.vocana.outputs.ref }}
          path: vocana
          persist-credentials: false
          token: ${{ secrets.VOCANA_TOKEN || github.token }}

      - name: Setup JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Publish Vocana to the local maven
        working-directory: vocana
        run: bash ./gradlew --no-daemon --max-workers=2 --console=plain publishToMavenLocal -x test

      - name: Build and run unit tests
        run: bash ./gradlew --no-daemon --max-workers=2 --console=plain build

      - name: Run game tests
        run: bash ./gradlew --no-daemon --max-workers=2 --console=plain runGameTestServer

      - name: List the built jar
        run: ls -l build/libs/
